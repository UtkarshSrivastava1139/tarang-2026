<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <radialGradient id="danceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#286B50" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#286B50" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#358967" />
      <stop offset="100%" stop-color="#286B50" />
    </linearGradient>
    <linearGradient id="goldGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8AB56" />
      <stop offset="100%" stop-color="#C49A4B" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="70" fill="url(#danceGlow)" />

  <!-- Outer Fine Ornamental Ring -->
  <circle cx="80" cy="80" r="68" stroke="#C49A4B" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />
  <circle cx="80" cy="80" r="64" stroke="#286B50" stroke-width="0.75" opacity="0.3" />

  <!-- Classical Dancer Silhouette -->
  <g transform="translate(80, 20)" text-anchor="middle">
    <!-- Traditional Mukut / Hair Bun (Juda with Mogra Flower Garland) -->
    <ellipse cx="0" cy="10" rx="10" ry="8" fill="#17264A" />
    <path d="M-9 10 C-9 4 9 4 9 10" stroke="#FFFDF9" stroke-width="2.5" stroke-dasharray="2 2" />
    <!-- Center Head Ornament (Maang Tikka) -->
    <circle cx="0" cy="5" r="2" fill="#D8AB56" />
    <path d="M0 6 L0 12" stroke="#D8AB56" stroke-width="1" />

    <!-- Head & Face Profile -->
    <circle cx="0" cy="16" r="7" fill="#F7F0E3" stroke="#C49A4B" stroke-width="1.5" />
    <!-- Jhumka Earrings -->
    <circle cx="-7" cy="18" r="1.5" fill="#D8AB56" />
    <circle cx="7" cy="18" r="1.5" fill="#D8AB56" />

    <!-- Neck & Necklace -->
    <path d="M-3 23 L3 23 L2 28 L-2 28 Z" fill="#F7F0E3" />
    <path d="M-5 28 C-3 31 3 31 5 28" stroke="#D8AB56" stroke-width="2" />

    <!-- Torso / Choli (Bodice) in Vermilion/Gold -->
    <path d="M-8 29 L8 29 L10 50 L-10 50 Z" fill="#AD3025" stroke="url(#goldGradD)" stroke-width="1.5" />
    <path d="M0 29 L0 50" stroke="#D8AB56" stroke-width="1" opacity="0.6" />

    <!-- Left Arm & Mudra (Alapadma / Extended Graceful Arc) -->
    <path d="M-8 32 C-26 34 -38 22 -44 14" stroke="#C49A4B" stroke-width="3" stroke-linecap="round" />
    <!-- Alta (Red dye on palms and fingertips) -->
    <circle cx="-45" cy="13" r="2.5" fill="#AD3025" />
    <path d="M-47 11 L-51 9 M-46 10 L-49 6 M-44 11 L-45 5" stroke="#AD3025" stroke-width="1.2" stroke-linecap="round" />
    <!-- Bangles on left wrist -->
    <path d="M-38 18 L-36 21" stroke="#D8AB56" stroke-width="2.5" />

    <!-- Right Arm & Mudra (Pataka / Curved Chest Gesture) -->
    <path d="M8 32 C22 36 28 42 34 32 C38 26 34 18 28 14" stroke="#C49A4B" stroke-width="3" stroke-linecap="round" />
    <circle cx="27" cy="13" r="2.5" fill="#AD3025" />
    <!-- Bangles on right wrist -->
    <path d="M30 22 L33 25" stroke="#D8AB56" stroke-width="2.5" />

    <!-- Waist Belt (Oddiyanam) -->
    <path d="M-11 50 C-5 53 5 53 11 50" stroke="#D8AB56" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="52" r="2" fill="#AD3025" />

    <!-- Fan Pleats (Kacche / Pre-stitched Bharatanatyam Fan) in Emerald -->
    <!-- Radiating fan lines -->
    <path d="M0 52 L-36 78 C-18 90 18 90 36 78 Z" fill="url(#emeraldGrad)" stroke="url(#goldGradD)" stroke-width="1.5" />
    <path d="M0 52 L-26 82 M0 52 L-14 86 M0 52 L0 88 M0 52 L14 86 M0 52 L26 82" stroke="#D8AB56" stroke-width="1" opacity="0.75" />
    <!-- Gold Zari Border on Fan Hem -->
    <path d="M-36 78 C-18 90 18 90 36 78" stroke="#D8AB56" stroke-width="3" stroke-linecap="round" />

    <!-- Legs in Classical Araimandi Pose (Knees bent out) -->
    <!-- Left Leg -->
    <path d="M-10 54 L-28 76 L-18 108" stroke="#17264A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Leg -->
    <path d="M10 54 L28 76 L18 108" stroke="#17264A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Ghungroos (Bells on Ankles) -->
    <!-- Left Ankle Bells -->
    <path d="M-22 105 L-14 107" stroke="#D8AB56" stroke-width="3" stroke-linecap="round" />
    <circle cx="-20" cy="107" r="1.5" fill="#AD3025" />
    <circle cx="-16" cy="108" r="1.5" fill="#AD3025" />
    <!-- Right Ankle Bells -->
    <path d="M14 107 L22 105" stroke="#D8AB56" stroke-width="3" stroke-linecap="round" />
    <circle cx="16" cy="108" r="1.5" fill="#AD3025" />
    <circle cx="20" cy="107" r="1.5" fill="#AD3025" />

    <!-- Feet with Red Alta Dye -->
    <ellipse cx="-16" cy="112" rx="6" ry="2.5" fill="#AD3025" />
    <ellipse cx="16" cy="112" rx="6" ry="2.5" fill="#AD3025" />
  </g>
</svg>
