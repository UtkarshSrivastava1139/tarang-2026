<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <radialGradient id="musicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E98727" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#E98727" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8AB56" />
      <stop offset="50%" stop-color="#C49A4B" />
      <stop offset="100%" stop-color="#9C762F" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="70" fill="url(#musicGlow)" />

  <!-- Outer Fine Ornamental Ring -->
  <circle cx="80" cy="80" r="68" stroke="#C49A4B" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />
  <circle cx="80" cy="80" r="64" stroke="#C49A4B" stroke-width="0.75" opacity="0.3" />

  <!-- Classical Sitar -->
  <g transform="translate(18, 14)">
    <!-- Long Dandi / Neck -->
    <path d="M78 14 L38 98" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Sitar Frets (Parda) -->
    <path d="M72 26 L66 23 M67 36 L61 33 M62 46 L56 43 M57 56 L51 53 M52 66 L46 63 M47 76 L41 73 M42 86 L36 83" stroke="#C49A4B" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Tuning Pegs (Khunti) -->
    <circle cx="79" cy="18" r="2.5" fill="#E98727" />
    <path d="M79 18 L86 15" stroke="#E98727" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="75" cy="24" r="2.5" fill="#E98727" />
    <path d="M75 24 L82 21" stroke="#E98727" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="71" cy="30" r="2.5" fill="#E98727" />
    <path d="M71 30 L78 27" stroke="#E98727" stroke-width="1.5" stroke-linecap="round" />

    <!-- Sitar Tumba (Resonator Body) -->
    <ellipse cx="30" cy="106" rx="20" ry="16" transform="rotate(-30 30 106)" fill="#F7F0E3" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Tumba Inset Engraving -->
    <ellipse cx="30" cy="106" rx="14" ry="10" transform="rotate(-30 30 106)" fill="#E98727" fill-opacity="0.12" stroke="#C49A4B" stroke-width="1" />
    <!-- Soundhole rosette -->
    <circle cx="30" cy="106" r="3.5" fill="#17264A" />

    <!-- Fine Strings -->
    <path d="M76 16 L33 103" stroke="#FFFFFF" stroke-width="1" opacity="0.8" />
    <path d="M75 18 L35 105" stroke="#E5D5B8" stroke-width="0.8" opacity="0.9" />
  </g>

  <!-- Classical Tabla Pair (Dayan & Bayan) -->
  <g transform="translate(74, 76)">
    <!-- Bayan (Bass drum - left) -->
    <g transform="translate(6, 12)">
      <!-- Drum Body -->
      <path d="M4 14 C4 32 32 32 32 14" fill="#E5D5B8" stroke="#C49A4B" stroke-width="2" />
      <!-- Head / Puri -->
      <ellipse cx="18" cy="14" rx="14" ry="7" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="2" />
      <!-- Syahi (Black tuning spot) -->
      <ellipse cx="19" cy="14" rx="6" ry="3.5" fill="#17264A" />
      <ellipse cx="19" cy="14" rx="7.5" ry="4.5" stroke="#C49A4B" stroke-width="0.8" fill="none" opacity="0.6" />
      <!-- Braid rim (Gajra) -->
      <ellipse cx="18" cy="14" rx="15" ry="7.5" stroke="#E98727" stroke-width="1.2" stroke-dasharray="1.5 2" />
      <!-- Straps (Bahr) -->
      <path d="M6 18 L10 30 M14 20 L16 31 M22 20 L20 31 M30 18 L26 30" stroke="#9C762F" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Dayan (Treble drum - right) -->
    <g transform="translate(32, 6)">
      <!-- Drum Body -->
      <path d="M3 12 C3 30 25 30 25 12" fill="#E5D5B8" stroke="#C49A4B" stroke-width="2" />
      <!-- Head / Puri -->
      <ellipse cx="14" cy="12" rx="11" ry="6" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="2" />
      <!-- Syahi -->
      <ellipse cx="14" cy="12" rx="5" ry="3" fill="#17264A" />
      <!-- Tuning Blocks (Gatta) -->
      <rect x="1" y="19" width="3" height="4" rx="1" fill="#C49A4B" />
      <rect x="24" y="19" width="3" height="4" rx="1" fill="#C49A4B" />
      <!-- Straps -->
      <path d="M5 16 L8 28 M14 18 L14 29 M23 16 L20 28" stroke="#9C762F" stroke-width="1" opacity="0.6" />
    </g>
  </g>

  <!-- Musical Swara Flourish Waves -->
  <path d="M102 32 C114 24 122 36 134 28" stroke="#E98727" stroke-width="1.75" stroke-linecap="round" fill="none" />
  <circle cx="136" cy="27" r="2" fill="#E98727" />
  <path d="M112 44 C122 38 128 48 138 42" stroke="#286B50" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <circle cx="140" cy="41" r="1.5" fill="#286B50" />
</svg>
