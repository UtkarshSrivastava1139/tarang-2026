<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <radialGradient id="artGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C49A4B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#C49A4B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8AB56" />
      <stop offset="50%" stop-color="#C49A4B" />
      <stop offset="100%" stop-color="#9C762F" />
    </linearGradient>
    <linearGradient id="peacockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#286B50" />
      <stop offset="50%" stop-color="#1E325E" />
      <stop offset="100%" stop-color="#C49A4B" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="70" fill="url(#artGlow)" />

  <!-- Outer Fine Ornamental Ring -->
  <circle cx="80" cy="80" r="68" stroke="#C49A4B" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />
  <circle cx="80" cy="80" r="64" stroke="#C49A4B" stroke-width="0.75" opacity="0.3" />

  <!-- Traditional Peacock Feather (Mayur Pankh - Emblem of Indian Fine Arts) -->
  <g transform="translate(46, 20)">
    <!-- Feather Stem -->
    <path d="M42 110 C40 80 34 50 18 20" stroke="#286B50" stroke-width="2.5" stroke-linecap="round" />
    <!-- Feather Eye (Chandrika) Outer Layer -->
    <ellipse cx="18" cy="20" rx="16" ry="18" fill="url(#peacockGrad)" stroke="url(#goldGradA)" stroke-width="1.8" />
    <!-- Blue/Navy Center -->
    <ellipse cx="18" cy="22" rx="10" ry="12" fill="#17264A" />
    <!-- Deep Emerald & Saffron Core -->
    <ellipse cx="18" cy="24" rx="6" ry="7" fill="#286B50" />
    <circle cx="18" cy="25" r="3" fill="#E98727" />

    <!-- Radiating Delicate Strands (Barbs) -->
    <path d="M12 8 C6 2 2 12 4 20 M24 8 C30 2 34 12 32 20 M8 26 C2 32 6 40 14 38 M28 26 C34 32 30 40 22 38" stroke="#C49A4B" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <path d="M22 50 C12 56 16 66 26 62 M28 72 C18 78 22 88 32 84" stroke="#286B50" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Traditional Kalamkari Artist Brush (Crossing with feather) -->
  <g transform="translate(40, 24)">
    <!-- Wooden Brush Handle -->
    <path d="M12 115 L74 35" stroke="url(#goldGradA)" stroke-width="4" stroke-linecap="round" />
    <!-- Metal Ferrule -->
    <line x1="72" y1="38" x2="80" y2="28" stroke="#17264A" stroke-width="5" stroke-linecap="round" />
    <!-- Fine Bristle Tip with Vermilion Paint -->
    <path d="M80 28 C84 22 88 20 88 18 C88 24 84 28 80 28 Z" fill="#AD3025" stroke="#AD3025" stroke-width="1" />
  </g>

  <!-- Earthen Diya (Auspicious Indian Lamp of Creative Illumination) -->
  <g transform="translate(68, 92)">
    <!-- Clay Diya Base -->
    <path d="M4 18 C8 32 38 32 42 18 C44 14 38 12 23 12 C8 12 2 14 4 18 Z" fill="#E5D5B8" stroke="url(#goldGradA)" stroke-width="2" />
    <!-- Spout Rim -->
    <ellipse cx="23" cy="14" rx="18" ry="4" fill="#FFFDF9" stroke="#C49A4B" stroke-width="1.2" />
    <!-- Oil Well -->
    <ellipse cx="23" cy="14" rx="12" ry="2.5" fill="#E98727" fill-opacity="0.3" />

    <!-- Auspicious Diya Flame -->
    <path d="M23 12 C18 7 19 0 23 -6 C27 0 28 7 23 12 Z" fill="#E98727" stroke="#D8AB56" stroke-width="1.5" />
    <path d="M23 11 C20 7 21 2 23 -2 C25 2 26 7 23 11 Z" fill="#FFFDF9" />
    <circle cx="23" cy="-7" r="1.5" fill="#FFFDF9" />
  </g>

  <!-- Rangoli Mandala Dots Accent -->
  <g fill="#C49A4B" opacity="0.6">
    <circle cx="34" cy="54" r="2" />
    <circle cx="42" cy="46" r="1.5" />
    <circle cx="50" cy="38" r="1" />
    <circle cx="126" cy="74" r="2" />
    <circle cx="132" cy="82" r="1.5" />
  </g>
</svg>
